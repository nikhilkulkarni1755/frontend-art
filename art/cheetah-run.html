<body><div id="root"></div><script>
const {clamp,mix,smooth,mixC,fract,vnoise}=Art;
function seg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const h=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1e-6),0,1);return Math.hypot(px-(ax+dx*h),py-(ay+dy*h));}
Art.mount({name:'Cheetah Run',slug:'cheetah-run',perspective:'side · full gallop',build:(view,AR)=>{
 const GY=0.70,cx=AR*0.5;
 return function(u,v,t){
  let c=mixC([250,214,150],[244,180,116],smooth(0,GY,v));
  c=mixC(c,[255,242,206],smooth(0.55,0,Math.hypot(u-AR*0.8,v-0.18))*0.45);
  if(v>=GY){c=mixC([208,170,98],[150,116,62],smooth(GY,1,v));
    const gy=GY+0.015+vnoise(u*12+t*2.4,3)*0.03;if(v<gy+0.02&&v>gy-0.02&&fract(u*5+t*2.4)<0.3)c=mixC(c,[120,150,70],0.5);}
  const ph=t*9,bob=Math.sin(ph*2)*0.01,cy=GY-0.12+bob;
  const legs=[[-0.055,ph,1],[-0.035,ph+0.5,1],[0.055,ph+Math.PI,1],[0.075,ph+Math.PI+0.5,1]];
  for(const Lg of legs){const hx=cx+Lg[0],hy=cy+0.035,sw=Math.sin(Lg[1]);const fx=hx+sw*0.055,fy=GY+0.015-Math.max(0,Math.cos(Lg[1]))*0.055;
    if(seg(u,v,hx,hy,(hx+fx)/2+sw*0.01,(hy+fy)/2,fx,fy)<0.011){}
    if(seg(u,v,hx,hy,fx,fy)<0.011)c=[196,150,70];}
  if(seg(u,v,cx-0.095,cy-0.015,cx-0.17-0.02*Math.sin(t*6),cy-0.035+0.035*Math.sin(t*6+1))<0.009)c=[202,158,76];
  if(((u-cx)/0.115)**2+((v-cy)/0.052)**2<1){c=(v-cy)>0.012?[238,210,154]:[216,170,80];if(vnoise(u*62,v*62)>0.63)c=mixC(c,[42,30,22],0.82);}
  if(seg(u,v,cx+0.095,cy-0.012,cx+0.15,cy-0.052)<0.028)c=[216,170,80];
  if(((u-(cx+0.172))/0.036)**2+((v-(cy-0.055))/0.03)**2<1){c=[220,174,82];
    if((u-(cx+0.16))<0&&(v-(cy-0.085))<0)c=mixC(c,[40,30,22],0.5);
    if(Math.hypot(u-(cx+0.188),v-(cy-0.062))<0.006)c=[18,14,12];
    if(seg(u,v,cx+0.183,cy-0.058,cx+0.183,cy-0.02)<0.004)c=mixC(c,[60,40,30],0.6);}
  return c;
 };
