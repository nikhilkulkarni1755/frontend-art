<!doctype html><html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Olympic Sprinter — frontend-art</title><script src="../engine.js"></script></head>
<body><div id="root"></div><script>
const {clamp,mix,smooth,mixC,fract,vnoise}=Art;
function seg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const h=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1e-6),0,1);return Math.hypot(px-(ax+dx*h),py-(ay+dy*h));}
Art.mount({name:'Olympic Sprinter',slug:'sprinter',perspective:'side · track',build:(view,AR)=>{
 const GY=0.70;
 return function(u,v,t){
  let c=mixC([70,96,140],[150,176,208],smooth(0,GY,v));
  if(v>=GY){c=mixC([206,96,66],[168,70,48],smooth(GY,1,v));
    // lane lines scroll (speed)
    const ln=fract(u*3.0+t*2.6);if(Math.abs(v-(GY+0.09))<0.006)c=[238,238,236];
    if(v>GY+0.14&&v<GY+0.16&&ln<0.5)c=[236,236,234];}
  const cx=AR*0.5, ph=t*10, lean=0.1;
  const hipx=cx,hipy=GY-0.17, shx=hipx+lean*0.12, shy=hipy-0.11;
  // legs
  for(const off of[0,Math.PI]){const a=ph+off;const kx=hipx+Math.sin(a)*0.05+0.02,ky=hipy+0.06-Math.max(0,Math.cos(a))*0.03;
    const fx=hipx+Math.sin(a)*0.1+0.03,fy=GY+0.01-Math.max(0,Math.sin(a+0.6))*0.06;
    if(seg(u,v,hipx,hipy,kx,ky)<0.013)c=[224,180,140];
    if(seg(u,v,kx,ky,fx,fy)<0.011)c=[222,178,138];}
  // torso
  if(seg(u,v,hipx,hipy,shx,shy)<0.026)c=[40,120,200];
  // arms
  for(const off of[Math.PI,0]){const a=ph+off;const ex=shx+Math.sin(a)*0.05+0.02,ey=shy+0.05;const hx=shx+Math.sin(a)*0.09+0.04,hy=shy+0.03-Math.cos(a)*0.03;
    if(seg(u,v,shx,shy,ex,ey)<0.012)c=[224,180,140];
    if(seg(u,v,ex,ey,hx,hy)<0.01)c=[224,180,140];}
  // head
  if(Math.hypot(u-(shx+0.015),v-(shy-0.035))<0.028){c=[64,46,36];if(v>shy-0.03)c=[224,180,140];
    if(Math.hypot(u-(shx+0.03),v-(shy-0.03))<0.005)c=[20,16,14];}
  return c;
 };
}});
</script></body></html>
