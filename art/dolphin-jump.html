<!doctype html><html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Dolphin Jump — frontend-art</title><script src="../engine.js"></script></head>
<body><div id="root"></div><script>
const {clamp,mix,smooth,mixC,fract,vnoise}=Art;
function seg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const h=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1e-6),0,1);return Math.hypot(px-(ax+dx*h),py-(ay+dy*h));}
Art.mount({name:'Dolphin Jump',slug:'dolphin-jump',perspective:'side · arc out of water',build:(view,AR)=>{
 const SEA=0.60;
 return function(u,v,t){
  let c;
  if(v<SEA){c=mixC([150,196,224],[218,236,244],smooth(0,SEA,v));
    c=mixC(c,[252,244,224],smooth(SEA*0.5,SEA,v)*0.35);}
  else{const wl=SEA+Math.sin(u*10+t*1.5)*0.006;c=mixC([36,118,150],[14,58,92],smooth(SEA,1,v));
    c=mixC(c,[120,200,210],smooth(0.5,1,Math.sin(u*14-t*2)*Math.sin(v*18))*0.14);
    if(v<wl+0.01)c=mixC(c,[200,236,240],0.5);}
  const p=fract(t/3.6),x=mix(-0.05,AR+0.05,p),arc=4*p*(1-p),y=SEA-arc*0.4;
  const ang=Math.atan2(-(0.4*(1-2*p)),(AR+0.1)/3.6*0+0.08); // slope of arc
  const dir=-(1-2*p); const pitch=Math.atan2(dir*0.4, 0.14);
  const cs=Math.cos(pitch),sn=Math.sin(pitch),lx=(u-x)*cs+(v-y)*sn,ly=-(u-x)*sn+(v-y)*cs;
  // body (curved spindle)
  const bend=0.5; const lyc=ly-bend*(lx*lx-0.004);
  let hw=0.03*Math.sqrt(clamp(1-(lx/0.11)**2,0,1));
  if(Math.abs(lx)<0.11&&Math.abs(lyc)<hw+0.002){c=lyc<0?[140,160,176]:[92,112,132];
    // belly lighter toward front-bottom
    if(lyc>0)c=mixC(c,[224,230,236],0.5);
    // eye
    if(Math.hypot(lx-0.07,lyc+0.006)<0.006)c=[18,20,26];
    // beak
    if(lx>0.09)c=[120,140,158];}
  // dorsal fin
  if(seg(lx,lyc,0.0,-hw*0+0.0,-0.02,-0.05)<0.012)c=[110,130,150];
  // fluke
  if(seg(lx,lyc,-0.1,0,-0.14,-0.03)<0.012||seg(lx,lyc,-0.1,0,-0.14,0.03)<0.012)c=[120,140,158];
  // splash near water entry/exit
  const near=Math.min(Math.abs(y-SEA));
  if(v>SEA-0.02&&v<SEA+0.03&&Math.abs(u-x)<0.06&&arc<0.25){if(vnoise(u*50,v*50+t*5)>0.5)c=[230,244,248];}
  return c;
 };
}});
</script></body></html>
